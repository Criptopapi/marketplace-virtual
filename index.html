<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketPlace Virtual - Plataforma SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-display { font-family: 'Orbitron', sans-serif; }
        .vending-grid { background: repeating-linear-gradient(45deg, #1e293b, #1e293b 10px, #182234 10px, #182234 20px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONFIGURACIÓN FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAlOxVzPhjz1fhz0n5NGroAj8H7w28SEz8",
            authDomain: "markets-bc527.firebaseapp.com",
            projectId: "markets-bc527",
            storageBucket: "markets-bc527.firebasestorage.app",
            messagingSenderId: "9908715735",
            appId: "1:9908715735:web:ebe16ec9c64306184cb092"
        };
        const app = firebase.initializeApp(firebaseConfig);
        const db = app.firestore();

        // --- UTILIDADES ---
        const compressImage = (file, callback) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_SIZE = 200;
                    let width = img.width;
                    let height = img.height;
                    if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                    else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        const sendTelegramMessage = async (order, businessName) => {
            const text = `🛒 NUEVO PEDIDO - ${businessName.toUpperCase()} (Cód: ${order.code})\n\n👤 Cliente: ${order.client}\n📍 Ubicación: ${order.location}\n📦 Pedido: ${order.items}\n💰 Total: S/ ${order.total.toFixed(2)}\n\n✅ Comprobante subido en la plataforma.`;
            try {
                await fetch('/api/send-telegram', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
            } catch (e) { console.error("Error Telegram:", e); }
        };

        // --- COMPONENTE PRINCIPAL Y ROUTER ---
        function App() {
            const [hash, setHash] = useState(window.location.hash);
            
            useEffect(() => {
                window.addEventListener('hashchange', () => setHash(window.location.hash));
            }, []);

            // Formato esperado: #/store/ID, #/admin/ID, #/superadmin
            const parts = hash.replace(/^#\//, '').split('/');
            const view = parts[0];
            const businessId = parts[1];

            if (view === 'superadmin') return <SuperAdminApp />;
            if (view === 'admin' && businessId) return <AdminApp businessId={businessId} />;
            if (view === 'store' && businessId) return <ClientApp businessId={businessId} />;
            
            // Pantalla de inicio (si no hay hash)
            return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-slate-900 text-white p-4 text-center">
                    <h1 className="text-3xl font-display font-bold text-green-400 mb-4">MARKETPLACE VIRTUAL</h1>
                    <p className="text-slate-400 mb-8">Plataforma SaaS para emprendedores.</p>
                    <div className="flex gap-4">
                        <a href="#/superadmin" className="bg-red-500 text-white px-6 py-3 rounded-lg font-bold hover:bg-red-600">Acceso Superadmin</a>
                    </div>
                </div>
            );
        }

        // --- VISTA DEL CLIENTE (TIENDA) ---
        function ClientApp({ businessId }) {
            const [business, setBusiness] = useState(null);
            const [products, setProducts] = useState([]);
            const [clientConfig, setClientConfig] = useState({ yapeNumber: '', yapeQR: '' });
            const [loading, setLoading] = useState(true);
            
            const [cart, setCart] = useState([]);
            const [view, setView] = useState('home');
            const [clientName, setClientName] = useState('');
            const [location, setLocation] = useState('');
            const [receipt, setReceipt] = useState(null);
            const [error, setError] = useState('');
            const [loadingOrder, setLoadingOrder] = useState(false);
            const [lastOrderInfo, setLastOrderInfo] = useState(null);

            useEffect(() => {
                const ref = db.collection('businesses').doc(businessId);
                ref.get().then(doc => {
                    if (doc.exists) setBusiness(doc.data());
                    setLoading(false);
                });
                ref.collection('products').orderBy('order', 'asc').onSnapshot(snap => {
                    setProducts(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                ref.collection('config').doc('client_payment').onSnapshot(doc => {
                    if (doc.exists) setClientConfig(doc.data());
                });
            }, [businessId]);

            const addToCart = (product) => {
                const existing = cart.find(item => item.id === product.id);
                if (existing && existing.qty >= product.stock) return;
                if (existing) setCart(cart.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item));
                else setCart([...cart, { ...product, qty: 1 }]);
            };
            const decreaseQty = (id) => {
                const existing = cart.find(item => item.id === id);
                if (existing.qty === 1) setCart(cart.filter(item => item.id !== id));
                else setCart(cart.map(item => item.id === id ? { ...item, qty: item.qty - 1 } : item));
            };
            const removeItem = (id) => setCart(cart.filter(item => item.id !== id));
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

            const copyYapeNumber = () => {
                if(clientConfig.yapeNumber) {
                    navigator.clipboard.writeText(clientConfig.yapeNumber.replace(/\s/g, ''));
                    alert("¡Número copiado! Ábrelo en tu app de Yape.");
                }
            };

            const confirmOrder = async () => {
                setError('');
                if(!clientName || !location || !receipt) {
                    setError("⚠️ Falta tu nombre, la ubicación o el comprobante de Yape.");
                    return;
                }
                setLoadingOrder(true);
                try {
                    const orderCode = "MP-" + Date.now().toString().slice(-6);
                    const orderData = {
                        code: orderCode,
                        client: clientName,
                        items: cart.map(p => `${p.name} (x${p.qty})`).join(", "),
                        total: totalPrice,
                        status: "Recibido",
                        location: location,
                        receipt: receipt,
                        createdAt: Date.now()
                    };
                    
                    await db.collection('businesses').doc(businessId).collection('orders').add(orderData);
                    await sendTelegramMessage(orderData, business?.name || businessId);

                    const batch = db.batch();
                    cart.forEach(item => {
                        const productRef = db.collection('businesses').doc(businessId).collection('products').doc(item.id);
                        batch.update(productRef, { stock: item.stock - item.qty });
                    });
                    await batch.commit();
                    
                    setLastOrderInfo({ code: orderCode, summary: orderData.items, total: totalPrice });
                    setCart([]); setClientName(''); setLocation(''); setReceipt(null);
                    setView('success');
                } catch (err) { setError("❌ Error al guardar el pedido."); }
                finally { setLoadingOrder(false); }
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center text-green-400 font-display">CARGANDO TIENDA...</div>;
            if (!business) return <div className="min-h-screen flex items-center justify-center text-red-400 font-display">TIENDA NO ENCONTRADA</div>;

            if(view === 'success' && lastOrderInfo) {
                return (
                    <div className="max-w-md mx-auto p-8 text-center bg-slate-900 min-h-screen flex flex-col justify-center">
                        <h2 className="text-3xl font-display font-bold text-green-400 mb-2">¡DESPACHADO! 🛒</h2>
                        <p className="text-slate-300 mb-6">{business.name} recibió tu pedido.</p>
                        <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 mb-6 text-left">
                            <p className="text-center text-green-400 font-display text-xl font-bold mb-4">CÓDIGO: {lastOrderInfo.code}</p>
                            <div className="border-t border-slate-700 pt-3 space-y-1">
                                <p className="text-sm text-slate-400">Resumen del pedido:</p>
                                <p className="text-white text-sm">{lastOrderInfo.summary}</p>
                                <p className="text-green-400 font-bold text-lg mt-2">Total: S/ {lastOrderInfo.total.toFixed(2)}</p>
                            </div>
                        </div>
                        <button onClick={() => { setView('home'); setLastOrderInfo(null); }} className="bg-green-500 text-white py-3 px-8 rounded-xl font-bold hover:bg-green-400 mb-2">Volver a la Tienda</button>
                        <a href={`#/admin/${businessId}`} className="text-sm text-slate-500 underline">Soy el Vendedor</a>
                    </div>
                );
            }

            const availableProducts = products.filter(p => p.stock > 0);

            return (
                <div className="max-w-md mx-auto bg-slate-800 min-h-screen relative pb-28 border-x border-slate-700">
                    <header className="p-4 flex justify-between items-center bg-black border-b-4 border-green-500 sticky top-0 z-20">
                        <div>
                            <h1 className="text-xl font-display font-bold tracking-wider text-green-400">{business.name.toUpperCase()}</h1>
                            <p className="text-[10px] text-slate-500 tracking-widest">MARKETPLACE VIRTUAL</p>
                        </div>
                        <div className="bg-green-900/40 border border-green-500 px-3 py-1 rounded-lg">
                            <span className="text-green-400 text-sm font-bold">🛒 {totalQty}</span>
                        </div>
                    </header>

                    <div className="p-4 vending-grid min-h-[calc(100vh-100px)]">
                        {availableProducts.length === 0 ? (
                            <div className="text-center text-slate-500 mt-20 font-display">MÁQUINA VACÍA</div>
                        ) : (
                            <div className="grid grid-cols-2 gap-4">
                                {availableProducts.map(p => {
                                    const itemInCart = cart.find(item => item.id === p.id);
                                    return (
                                        <div key={p.id} className={`bg-slate-700 rounded-xl overflow-hidden border-2 ${itemInCart ? 'border-green-400 shadow-[0_0_15px_rgba(74,222,128,0.3)]' : 'border-slate-600'}`}>
                                            <img src={p.img} alt={p.name} className="w-full aspect-square object-cover" />
                                            <div className="p-2">
                                                <h3 className="font-bold text-xs text-white h-8 overflow-hidden">{p.name}</h3>
                                                <span className="text-green-400 font-display font-bold text-sm block mb-1">S/ {p.price.toFixed(2)}</span>
                                                {itemInCart ? (
                                                    <div className="flex items-center justify-between mt-2 bg-black/30 rounded-lg p-1">
                                                        <button onClick={() => decreaseQty(p.id)} className="text-white bg-red-500 w-6 h-6 rounded font-bold flex items-center justify-center">-</button>
                                                        <span className="text-white font-bold text-sm">{itemInCart.qty}</span>
                                                        <button onClick={() => addToCart(p)} disabled={itemInCart.qty >= p.stock} className="text-white bg-green-500 w-6 h-6 rounded font-bold flex items-center justify-center">+</button>
                                                    </div>
                                                ) : (
                                                    <button onClick={() => addToCart(p)} className="w-full bg-slate-900 text-green-400 text-xs py-1.5 rounded-lg font-bold border border-green-500/30 hover:bg-slate-950">+ Agregar</button>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    {view === 'checkout' && (
                        <div className="fixed inset-0 bg-black bg-opacity-80 flex items-end justify-center z-50">
                            <div className="bg-slate-800 w-full max-w-md rounded-t-2xl p-6 max-h-[90vh] overflow-y-auto border-t-2 border-green-500">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-display font-bold text-green-400">TU CARRITO</h2>
                                    <button onClick={() => setView('home')} className="text-slate-400 text-2xl">&times;</button>
                                </div>
                                <div className="bg-black/30 rounded-xl p-3 mb-4 border border-slate-700">
                                    {cart.length === 0 ? <p className="text-slate-500 text-center text-sm py-4">Carrito vacío</p> : cart.map(item => (
                                        <div key={item.id} className="flex items-center gap-2 py-2 border-b border-slate-700 last:border-0">
                                            <img src={item.img} className="w-10 h-10 rounded object-cover" alt={item.name} />
                                            <div className="flex-1">
                                                <p className="text-white text-sm font-semibold">{item.name}</p>
                                                <p className="text-green-400 text-xs">S/ {item.price.toFixed(2)} c/u</p>
                                            </div>
                                            <div className="flex items-center gap-2 bg-slate-900 rounded-lg p-1">
                                                <button onClick={() => decreaseQty(item.id)} className="text-white bg-red-500 w-5 h-5 rounded text-xs font-bold">-</button>
                                                <span className="text-white text-sm font-bold">{item.qty}</span>
                                                <button onClick={() => addToCart(item)} disabled={item.qty >= item.stock} className="text-white bg-green-500 w-5 h-5 rounded text-xs font-bold">+</button>
                                            </div>
                                            <button onClick={() => removeItem(item.id)} className="text-red-400 hover:text-red-300 ml-1">🗑️</button>
                                        </div>
                                    ))}
                                </div>
                                {cart.length > 0 && (
                                    <>
                                        <div className="flex justify-between font-display font-bold text-green-400 mb-4 text-lg">
                                            <span>TOTAL</span><span>S/ {totalPrice.toFixed(2)}</span>
                                        </div>
                                        {error && <div className="bg-red-900/50 border border-red-500 text-red-300 text-sm p-2 rounded mb-4">{error}</div>}
                                        <div className="mb-4">
                                            <label className="block text-xs font-bold text-slate-400 mb-1">1. Paga a este Yape</label>
                                            <div className="bg-slate-900 p-3 rounded-xl flex flex-col items-center border border-slate-700">
                                                {clientConfig.yapeQR ? <img src={clientConfig.yapeQR} alt="QR Yape" className="w-32 h-32 mb-2 rounded object-cover" /> : <p className="text-slate-500 text-xs my-4">El vendedor no ha configurado su QR.</p>}
                                                {clientConfig.yapeNumber && <button onClick={copyYapeNumber} className="bg-slate-700 text-green-400 text-sm font-bold px-3 py-2 rounded-lg hover:bg-slate-600 w-full flex items-center justify-center gap-2"><span>{clientConfig.yapeNumber}</span> 📋</button>}
                                            </div>
                                        </div>
                                        <div className="mb-4">
                                            <label className="block text-xs font-bold text-slate-400 mb-1">2. Sube tu comprobante</label>
                                            <input type="file" accept="image/*" onChange={(e) => e.target.files[0] && compressImage(e.target.files[0], src => setReceipt(src))} className="w-full text-sm p-2 bg-slate-900 rounded-lg border border-slate-700 text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-green-900/50 file:text-green-400" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-2 mb-6">
                                            <input type="text" value={clientName} onChange={(e) => setClientName(e.target.value)} placeholder="Tu Nombre" className="w-full p-2 rounded-lg border border-slate-700 bg-slate-900 text-white text-sm" />
                                            <input type="text" value={location} onChange={(e) => setLocation(e.target.value)} placeholder="Ubicación" className="w-full p-2 rounded-lg border border-slate-700 bg-slate-900 text-white text-sm" />
                                        </div>
                                        <button onClick={confirmOrder} disabled={loadingOrder} className="w-full bg-green-500 text-white py-3 rounded-xl font-display font-bold hover:bg-green-400 disabled:opacity-50">{loadingOrder ? 'Procesando...' : 'CONFIRMAR PEDIDO'}</button>
                                    </>
                                )}
                            </div>
                        </div>
                    )}

                    {cart.length > 0 && view !== 'checkout' && (
                        <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-3 bg-black/90 backdrop-blur border-t border-green-500/30">
                            <button onClick={() => setView('checkout')} className="w-full bg-green-500 text-white py-3 rounded-xl font-display font-bold flex justify-between items-center px-6 hover:bg-green-400">
                                <span>PAGAR AHORA</span><span>S/ {totalPrice.toFixed(2)}</span>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // --- VISTA ADMIN (NEGOCIO) ---
        function AdminApp({ businessId }) {
            const [business, setBusiness] = useState(null);
            const [products, setProducts] = useState([]);
            const [orders, setOrders] = useState([]);
            const [payments, setPayments] = useState([]);
            const [superadminConfig, setSuperadminConfig] = useState({});
            const [tab, setTab] = useState('pedidos');
            const [auth, setAuth] = useState(false);
            const [pass, setPass] = useState('');
            const [error, setError] = useState('');
            const [searchTerm, setSearchTerm] = useState('');
            const [modalReceipt, setModalReceipt] = useState(null);
            
            const [commReceipt, setCommReceipt] = useState(null);
            const [commAmount, setCommAmount] = useState('');
            const [commDate, setCommDate] = useState('');
            const [newPass, setNewPass] = useState('');

            const [editYapeNumber, setEditYapeNumber] = useState('');
            const [editYapeQR, setEditYapeQR] = useState('');

            const bRef = db.collection('businesses').doc(businessId);

            useEffect(() => {
                bRef.get().then(doc => {
                    if (doc.exists) setBusiness(doc.data());
                });
                bRef.collection('products').orderBy('order', 'asc').onSnapshot(snap => setProducts(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                db.collection('platform_config').doc('superadmin_payment').onSnapshot(doc => { if(doc.exists) setSuperadminConfig(doc.data()) });
            }, [businessId]);

            useEffect(() => {
                if (auth) {
                    bRef.collection('orders').orderBy('createdAt', 'desc').onSnapshot(snap => setOrders(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                    bRef.collection('payments').orderBy('createdAt', 'desc').onSnapshot(snap => setPayments(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                }
            }, [auth]);

            const login = async (e) => {
                e.preventDefault();
                if (business && pass === business.adminPassword) { setAuth(true); setError(''); }
                else setError('Contraseña incorrecta');
            };

            const updateOrderStatus = async (id, status) => { await bRef.collection('orders').doc(id).update({ status }); };
            const addNewProduct = async () => { 
                const newOrder = products.length > 0 ? Math.max(...products.map(p => p.order || 0)) + 1 : 1;
                await bRef.collection('products').add({ code: "N", name: "Nuevo", price: 1.00, img: "https://via.placeholder.com/150", stock: 0, order: newOrder }); 
            };
            const updateProductField = async (id, field, value) => { await bRef.collection('products').doc(id).update({ [field]: value }); };
            const deleteProduct = async (id) => { if(confirm("¿Eliminar?")) await bRef.collection('products').doc(id).delete(); };
            
            const saveClientConfig = async (e) => {
                e.preventDefault();
                await bRef.collection('config').doc('client_payment').set({ yapeNumber: editYapeNumber, yapeQR: editYapeQR });
                alert("Configuración de pago guardada.");
            };

            const changePassword = async (e) => {
                e.preventDefault();
                if(newPass.length < 4) { alert("La contraseña debe tener al menos 4 caracteres."); return; }
                await bRef.update({ adminPassword: newPass });
                setNewPass('');
                alert("Contraseña actualizada.");
            };

            const submitPayment = async (e) => {
                e.preventDefault();
                if(!commReceipt || !commAmount || !commDate) { alert("Faltan datos."); return; }
                await bRef.collection('payments').add({ receipt: commReceipt, amountPaid: parseFloat(commAmount), paymentDate: commDate, status: "Pendiente", createdAt: Date.now() });
                alert("Comprobante enviado.");
            };

            if (!business) return <div className="min-h-screen flex items-center justify-center text-red-400">Cargando negocio...</div>;

            if (!auth) {
                return (
                    <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-4">
                        <form onSubmit={login} className="bg-slate-800 p-6 rounded-xl border border-slate-700 w-full max-w-sm">
                            <h2 className="text-xl font-display font-bold text-green-400 mb-4 text-center">{business.name.toUpperCase()} - ADMIN</h2>
                            <input type="password" value={pass} onChange={(e) => setPass(e.target.value)} placeholder="Contraseña" className="w-full p-2 rounded-lg border border-slate-700 bg-slate-900 text-white mb-2" autoFocus />
                            {error && <p className="text-red-400 text-sm mb-2">{error}</p>}
                            <button type="submit" className="w-full bg-green-500 text-white py-2 rounded-lg font-bold">Entrar</button>
                            <a href={`#/store/${businessId}`} className="block w-full text-slate-500 text-sm mt-2 text-center hover:underline">← Volver a la tienda</a>
                        </form>
                    </div>
                );
            }

            const rate = business.commissionRate || 0.05;
            const validOrders = orders.filter(o => o.status !== "Anulado");
            const totalSalesAllTime = validOrders.filter(o => o.status === "Entregado").reduce((sum, o) => sum + o.total, 0);
            const totalCommissionAllTime = totalSalesAllTime * rate;
            const totalPaid = payments.filter(p => p.status === "Aprobado").reduce((sum, p) => sum + (Number(p.amountPaid) || 0), 0);
            const currentDebt = totalCommissionAllTime - totalPaid;

            return (
                <div className="min-h-screen bg-slate-900 font-inter p-4">
                    {modalReceipt && (
                        <div className="fixed inset-0 bg-black bg-opacity-90 z-50 flex items-center justify-center p-4" onClick={() => setModalReceipt(null)}>
                            <img src={modalReceipt} className="max-w-full max-h-full rounded-lg" alt="Comprobante" />
                            <button className="absolute top-4 right-4 text-white text-4xl">&times;</button>
                        </div>
                    )}
                    <div className="max-w-4xl mx-auto">
                        <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                            <div>
                                <h2 className="text-xl font-display font-bold text-green-400">{business.name.toUpperCase()} - ADMIN</h2>
                                <p className="text-sm text-slate-500">Control de Pedidos</p>
                            </div>
                            <a href={`#/store/${businessId}`} className="text-sm text-slate-400 hover:text-white border border-slate-700 px-3 py-1 rounded">← Volver</a>
                        </div>
                        <div className="flex gap-2 mb-6 overflow-x-auto pb-2">
                            <button onClick={() => setTab('pedidos')} className={`px-4 py-2 rounded-lg text-sm font-bold ${tab === 'pedidos' ? 'bg-green-500 text-white' : 'bg-slate-800 text-slate-400'}`}>Pedidos</button>
                            <button onClick={() => setTab('productos')} className={`px-4 py-2 rounded-lg text-sm font-bold ${tab === 'productos' ? 'bg-green-500 text-white' : 'bg-slate-800 text-slate-400'}`}>Productos</button>
                            <button onClick={() => setTab('pagos')} className={`px-4 py-2 rounded-lg text-sm font-bold ${tab === 'pagos' ? 'bg-green-500 text-white' : 'bg-slate-800 text-slate-400'}`}>Pagos</button>
                            <button onClick={() => setTab('tienda')} className={`px-4 py-2 rounded-lg text-sm font-bold ${tab === 'tienda' ? 'bg-green-500 text-white' : 'bg-slate-800 text-slate-400'}`}>Config</button>
                        </div>

                        {tab === 'pedidos' && (
                            <>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
                                    <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                        <p className="text-slate-400 text-xs">Ventas Históricas</p>
                                        <p className="text-xl font-bold text-white">S/ {totalSalesAllTime.toFixed(2)}</p>
                                    </div>
                                    <div className="bg-slate-800 p-4 rounded-xl border border-red-500/30">
                                        <p className="text-slate-400 text-xs">Comisión Pendiente ({(rate*100).toFixed(0)}%)</p>
                                        <p className="text-xl font-bold text-red-400">S/ {currentDebt.toFixed(2)}</p>
                                    </div>
                                </div>
                                <input type="text" placeholder="🔍 Buscar..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full p-2 rounded-lg border border-slate-700 bg-slate-800 text-white text-sm mb-4" />
                                <div className="space-y-3">
                                    {orders.filter(o => JSON.stringify(o).toLowerCase().includes(searchTerm.toLowerCase())).map(order => (
                                        <div key={order.id} className={`bg-slate-800 p-4 rounded-xl border-l-4 ${order.status === 'Anulado' ? 'border-red-500 opacity-60' : 'border-green-500'}`}>
                                            <p className="text-green-400 font-bold text-sm">Cód: {order.code}</p>
                                            <p className="text-white text-sm">👤 {order.client}</p>
                                            <p className="text-white text-sm">{order.items}</p>
                                            <p className="text-green-400 text-sm mb-2">Total: S/ {order.total.toFixed(2)}</p>
                                            <button onClick={() => setModalReceipt(order.receipt)} className="text-xs bg-slate-700 text-white px-2 py-1 rounded mb-2">👁️ Ver</button>
                                            <div className="flex gap-1 mt-2">
                                                {order.status === 'Recibido' && <button onClick={() => updateOrderStatus(order.id, 'En Camino')} className="text-xs bg-blue-500 text-white px-2 py-1 rounded font-bold flex-1">Despachar</button>}
                                                {order.status === 'En Camino' && <button onClick={() => updateOrderStatus(order.id, 'Entregado')} className="text-xs bg-green-500 text-white px-2 py-1 rounded font-bold flex-1">Entregado</button>}
                                                {order.status !== 'Entregado' && order.status !== 'Anulado' && <button onClick={() => updateOrderStatus(order.id, 'Anulado')} className="text-xs bg-red-800 text-white px-2 py-1 rounded font-bold flex-1">Anular</button>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}

                        {tab === 'productos' && (
                            <div className="bg-slate-800 p-4 rounded-xl">
                                <button onClick={addNewProduct} className="bg-green-500 text-white px-3 py-1.5 rounded-lg text-sm font-bold mb-4">+ Agregar</button>
                                {products.map(p => (
                                    <div key={p.id} className="bg-slate-900 p-3 rounded-lg mb-2 flex gap-2 items-center border border-slate-700">
                                        <img src={p.img} className="w-12 h-12 rounded object-cover" alt={p.name} />
                                        <input type="text" value={p.name} onChange={(e) => updateProductField(p.id, 'name', e.target.value)} className="flex-1 bg-slate-800 text-white text-sm p-1 rounded border border-slate-700" />
                                        <input type="number" value={p.price} onChange={(e) => updateProductField(p.id, 'price', parseFloat(e.target.value)||0)} className="w-20 bg-slate-800 text-white text-sm p-1 rounded border border-slate-700" />
                                        <button onClick={() => deleteProduct(p.id)} className="text-red-400">🗑️</button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {tab === 'pagos' && (
                            <div>
                                <div className="bg-slate-800 p-4 rounded-xl mb-6">
                                    <h3 className="text-lg font-bold text-white mb-4">Declarar Pago</h3>
                                    <div className="flex flex-col gap-2">
                                        <input type="number" value={commAmount} onChange={(e) => setCommAmount(e.target.value)} placeholder="Monto (S/)" className="w-full p-2 rounded-lg border border-slate-700 bg-slate-900 text-white text-sm" />
                                        <input type="date" value={commDate} onChange={(e) => setCommDate(e.target.value)} className="w-full p-2 rounded-lg border border-slate-700 bg-slate-900 text-white text-sm" />
                                        <input type="file" onChange={(e) => e.target.files[0] && compressImage(e.target.files[0], src => setCommReceipt(src))} className="w-full text-sm text-slate-400 file:bg-green-900/50 file:text-green-400 file:rounded file:border-0" />
                                        <button onClick={submitPayment} className="bg-green-500 text-white py-2 rounded-lg font-bold">Enviar</button>
                                    </div>
                                </div>
                                <div className="space-y-3">
                                    {payments.map(pay => (
                                        <div key={pay.id} className="bg-slate-800 p-3 rounded-xl flex justify-between items-center">
                                            <span className="text-white text-sm">S/ {pay.amountPaid} - {pay.status}</span>
                                            <button onClick={() => setModalReceipt(pay.receipt)} className="text-xs bg-slate-700 text-white px-2 py-1 rounded">Ver</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === 'tienda' && (
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-4 rounded-xl">
                                    <h3 className="text-lg font-bold text-white mb-4">Configuración de Yape</h3>
                                    <input type="text" value={editYapeNumber} onChange={(e) => setEditYapeNumber(e.target.value)} placeholder="Número Yape" className="w-full p-2 rounded-lg border border-slate-700 bg-slate-900 text-white text-sm mb-2" />
                                    <input type="file" onChange={(e) => e.target.files[0] && compressImage(e.target.files[0], src => setEditYapeQR(src))} className="w-full text-sm text-slate-400 mb-2" />
                                    <button onClick={saveClientConfig} className="bg-green-500 text-white py-2 px-4 rounded-lg font-bold">Guardar Yape</button>
                                </div>
                                <div className="bg-slate-800 p-4 rounded-xl">
                                    <h3 className="text-lg font-bold text-white mb-4">Cambiar Contraseña</h3>
                                    <input type="password" value={newPass} onChange={(e) => setNewPass(e.target.value)} placeholder="Nueva Contraseña" className="w-full p-2 rounded-lg border border-slate-700 bg-slate-900 text-white text-sm mb-2" />
                                    <button onClick={changePassword} className="bg-blue-600 text-white py-2 px-4 rounded-lg font-bold">Actualizar Contraseña</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- VISTA SUPERADMIN (PLATAFORMA) ---
        function SuperAdminApp() {
            const [auth, setAuth] = useState(false);
            const [pass, setPass] = useState('');
            const [businesses, setBusinesses] = useState([]);
            const [superadminConfig, setSuperadminConfig] = useState({});
            const [showForm, setShowForm] = useState(false);
            const [newBiz, setNewBiz] = useState({ name: '', id: '', password: '', rate: 5 });

            useEffect(() => {
                if (auth) {
                    db.collection('businesses').onSnapshot(snap => {
                        setBusinesses(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                    db.collection('platform_config').doc('superadmin_payment').onSnapshot(doc => { if(doc.exists) setSuperadminConfig(doc.data()) });
                }
            }, [auth]);

            const login = async (e) => {
                e.preventDefault();
                const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pass }) });
                const data = await res.json();
                if (data.success && data.role === 'superadmin') setAuth(true);
                else alert("Contraseña incorrecta");
            };

            const createBusiness = async (e) => {
                e.preventDefault();
                if(!newBiz.name || !newBiz.id || !newBiz.password) { alert("Faltan datos"); return; }
                const bRef = db.collection('businesses').doc(newBiz.id.toLowerCase().replace(/\s/g, '-'));
                const doc = await bRef.get();
                if(doc.exists) { alert("Este ID ya existe"); return; }
                
                await bRef.set({
                    name: newBiz.name,
                    adminPassword: newBiz.password,
                    commissionRate: parseFloat(newBiz.rate)/100 || 0.05,
                    createdAt: Date.now()
                });
                
                // Inicializar productos dummy
                await bRef.collection('products').add({ code: "P1", name: "Producto Ejemplo", price: 10.00, img: "https://via.placeholder.com/150", stock: 100, order: 1 });
                
                setNewBiz({ name: '', id: '', password: '', rate: 5 });
                setShowForm(false);
                alert("Negocio creado con éxito!");
            };

            if (!auth) {
                return (
                    <div className="min-h-screen bg-black flex flex-col items-center justify-center p-4">
                        <form onSubmit={login} className="bg-slate-900 p-6 rounded-xl border border-red-500 w-full max-w-sm">
                            <h2 className="text-xl font-display font-bold text-red-500 mb-4 text-center">SUPERADMIN PANEL</h2>
                            <input type="password" value={pass} onChange={(e) => setPass(e.target.value)} placeholder="Master Password" className="w-full p-2 rounded-lg border border-slate-700 bg-slate-800 text-white mb-2" autoFocus />
                            <button type="submit" className="w-full bg-red-500 text-white py-2 rounded-lg font-bold">Acceder</button>
                            <a href="#/" className="block w-full text-slate-500 text-sm mt-2 text-center hover:underline">← Volver</a>
                        </form>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-black font-inter p-4 text-white">
                    <div className="max-w-4xl mx-auto">
                        <div className="flex justify-between items-center mb-6 border-b border-red-500 pb-4">
                            <h2 className="text-xl font-display font-bold text-red-500">SUPERADMIN - GESTIÓN DE NEGOCIOS</h2>
                            <a href="#/" className="text-sm text-slate-400 hover:text-white border border-slate-700 px-3 py-1 rounded">← Salir</a>
                        </div>

                        <button onClick={() => setShowForm(!showForm)} className="bg-green-500 text-white px-4 py-2 rounded font-bold text-sm mb-6">+ Crear Nuevo Negocio</button>

                        {showForm && (
                            <div className="bg-slate-900 p-4 rounded-xl mb-6 border border-green-500">
                                <h3 className="text-lg font-bold mb-4">Datos del Nuevo Negocio</h3>
                                <form onSubmit={createBusiness} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <input type="text" value={newBiz.name} onChange={(e) => setNewBiz({...newBiz, name: e.target.value})} placeholder="Nombre (Ej: Abi Kôbô)" className="bg-slate-800 p-2 rounded border border-slate-700" required />
                                    <input type="text" value={newBiz.id} onChange={(e) => setNewBiz({...newBiz, id: e.target.value})} placeholder="ID URL (Ej: abi-kobo)" className="bg-slate-800 p-2 rounded border border-slate-700" required />
                                    <input type="text" value={newBiz.password} onChange={(e) => setNewBiz({...newBiz, password: e.target.value})} placeholder="Contraseña inicial para el Admin" className="bg-slate-800 p-2 rounded border border-slate-700" required />
                                    <input type="number" value={newBiz.rate} onChange={(e) => setNewBiz({...newBiz, rate: e.target.value})} placeholder="Comisión (%)" className="bg-slate-800 p-2 rounded border border-slate-700" />
                                    <button type="submit" className="bg-green-500 text-white py-2 rounded font-bold col-span-full">Crear Negocio</button>
                                </form>
                            </div>
                        )}

                        <h3 className="text-lg font-bold mb-4">Negocios Activos ({businesses.length})</h3>
                        <div className="space-y-4">
                            {businesses.map(b => {
                                const rate = b.commissionRate || 0.05;
                                return (
                                    <div key={b.id} className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                                        <div className="flex justify-between items-center mb-2">
                                            <h4 className="text-lg font-bold">{b.name} <span className="text-slate-500 text-xs">({b.id})</span></h4>
                                            <span className="text-xs bg-red-900/50 text-red-400 px-2 py-1 rounded">Comisión: {(rate*100).toFixed(0)}%</span>
                                        </div>
                                        <div className="text-sm text-slate-400 mb-3">
                                            <p>Contraseña Admin: {b.adminPassword}</p>
                                        </div>
                                        <div className="flex flex-col md:flex-row gap-2 text-xs">
                                            <a href={`#/store/${b.id}`} target="_blank" className="bg-blue-600 text-white px-3 py-2 rounded font-bold text-center flex-1">Ver Tienda</a>
                                            <a href={`#/admin/${b.id}`} target="_blank" className="bg-slate-700 text-white px-3 py-2 rounded font-bold text-center flex-1">Panel Admin</a>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
